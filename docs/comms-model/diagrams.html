<h2 class="dg-h">Data and flow diagrams</h2>
<p class="dg-intro">Four pictures of the system before it exists: what gets stored, how every channel ends up in one thread, where messages leave the building, and how an agent earns or loses the right to send.</p>

<figcaption>
  <strong>Everything that happens is a row in one ledger, and every row says which run caused it.</strong>
  <p>A customer can have several phone numbers and emails, but only one conversation per city. Every message, call, draft and flag is appended to that conversation's ledger and never edited. When an agent runs it gets a numbered run, and anything it produces carries that number, so Ben can always ask "why did it do that". Whether a thread turned into a paid job is worked out by joining the ledger to quotes and deposits at the moment you ask, so there is no "outcome" box to go stale.</p>
</figcaption>
</figure>

  <strong>Five ways in, one thread, one way out.</strong>
  <p>Whatever a customer uses, the adapter for that channel turns it into the same "message arrived" row, so a WhatsApp photo, a voicemail transcript and a web form all land in the same conversation. The desk (rules, agents and Ben) reads one thread and never has to know which channel it came from. Going out, every reply is written to the ledger before it is delivered. On WhatsApp a reply can only be free text inside 24 hours of the customer's last message; after that it must be an approved template, and if none fits it drops to SMS.</p>
</figcaption>

<!-- ============================================================ 4. AUTONOMY PER INTENT -->
<figure class="dg-fig">
<svg viewBox="0 0 900 400" role="img" aria-label="Autonomy per intent as a state machine. Every Scoper intent starts in DRAFT, where Ben approves each message. It is promoted to SEND only when evals pass three times in a row at 100 percent, at least 30 verdicts across the pack in 30 days are at least 90 percent unedited, there has never been an unsafe reject, and no guard escalations in 14 days. In SEND the Verifier samples 10 percent. It is demoted back to DRAFT on any unsafe reject, a customer opt-out, an incident tag, or sampled approval below 80 percent. A separate Ben-only lane for money, dates and complaints has no transition into SEND, ever.">

    <marker id="dg4-a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 Z" fill="currentColor"/></marker>

<figcaption>
  <strong>Sending is earned per intent from evidence, and lost faster than it is won.</strong>
  <p>Each kind of reply (ask for a photo, confirm receipt, point to the quote page) starts with Ben approving every message. Only when the tests pass three times running, Ben has tapped "fine" on enough drafts across the pack, and nothing unsafe has ever slipped does that one intent go automatic. Once automatic, a tenth of what it sends is checked the next morning, and a single unsafe verdict or a customer opting out drops it straight back to Ben. Money, dates and complaints are not on this ladder at all: there is no rung for them to climb.</p>
</figcaption>
