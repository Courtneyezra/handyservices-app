# no-mistakes pipeline configuration for handyservices-app.
# Keys are documented at https://kunchenguid.github.io/no-mistakes/reference/repo-config/ and by
# `no-mistakes doctor`. commands.*, test.instructions and document.instructions are read only from the
# default-branch copy of this file.

commands:
  prepare: "npm ci"

# Documentation ownership for the document step.
document:
  instructions: |
    AGENTS.md is the map for every session; docs/RUNBOOK.md owns operations. A comms change is
    documented under docs/comms-v2 (README.md, contracts.md, design.md, checklist.md) and in
    server/comms-v2/README.md; the old desk's design stays in docs/COMMS_AGENTS_V3_DESIGN.md.
    Never duplicate a fact: point at its owner.

# Product startup and live validation. The test step runs the product end to end as Ben would,
# against the running app, and records the evidence in the PR; the human merges on evidence.
test:
  instructions: |
    Environment: a run copy lives under a run root that carries a direnv .envrc, so its shell
    inherits the non-production environment: the Neon branch database, NODE_ENV=development,
    COMMS_WORKER=0, Stripe and Twilio on their test credentials where placed and on well-formed
    inert values until then, and well-formed inert values for the providers without test
    credentials (Meta, storage, paging). If a variable such as DATABASE_URL is missing from your
    shell, run every command through `direnv exec . <command>`. Never print a variable's value;
    refer to variables by name. DATABASE_URL must never contain the production host marker
    (ep-broad-king); stop if it does.

    Pick a free TCP port for this run (for example with `node -e` opening a server on port 0 and
    printing the port it was given), export it as PORT, and start the app with
    `PORT=<port> npm run dev`. Derive every URL from that value: the app serves
    http://127.0.0.1:$PORT. Never use a fixed port; the app kills whatever already listens on the
    port it is given, so a fixed one would stop a parallel run or a developer's server.
    Open http://127.0.0.1:$PORT/admin/login and log in as Ben with the email in
    PIPELINE_ADMIN_EMAIL and the password in PIPELINE_ADMIN_PASSWORD from the environment
    (valid on the Neon branch only). Then open http://127.0.0.1:$PORT/admin/sandbox and drive the
    change under test as Ben would: the sandbox types as a customer on the reserved number and
    nothing it does can reach a real customer.

    For a comms change, run the relevant lines of docs/comms-v2/checklist.md as sandbox
    conversations. For the new desk under server/comms-v2 use its own door: `npm run
    comms-v2:door` serves it on a loopback port (the URL is printed once; POST /start, /message,
    /run, /age, /reset, and for Goal 4 POST /price, POST /accept, GET /quote). Model calls are live;
    a refused or rate-limited model is a finding, not a pass.

    Goal 4, the Quoting specialist, on the comms-v2 door, one thread in this order (the ready
    turn runs the estimator and the pricing engine and can take up to two minutes):
    4.1 and 4.2: POST /start with a job and a postcode in one message and no photo ("my kitchen
    mixer tap is dripping at the base and needs replacing, NG9 2AB"); expect a reply with no
    figure, state.conversation.stage ready, state.quote.slug set and plannedSend.evidence.summary
    containing "quoting: drafted".
    4.3: state.quote.notifications has exactly one entry of kind ready_to_price whose link is
    /admin/price/<slug>; GET /quote shows record.status draft with every pricePence null.
    4.4: open http://127.0.0.1:$PORT/admin/price/<slug> in the app as Ben and screenshot it: the
    lines, the suggestions, and the missing list ("Missing, yours to request") on the first line's
    notes.
    4.5: POST /run (expect the note "not due"), POST /age {"hours": 5}, POST /run again: the note
    says "chase 1 recorded for Ben" and state.quote.notifications gains a chase; nothing is sent
    to the customer on either pass.
    5.2: POST /message "Does that include a new tap?": the reply answers from the draft's scope
    (what the line covers, what is not included) with no figure; a money hold for Ben beside it
    is 2.7 still standing before the quote, not a failure of 5.2.
    A photo before 5.1, so Ben's send is driven on the thread that can refuse it: POST /message as
    multipart with a photo attached and the text "here is the tap"; the reply thanks for it once
    and state.caseFile.ledger shows media thankedAt set. Ben's own message opens "thanks for the
    photos and the details", which Contract 4's ask-ledger guard would refuse as a second thanks,
    so a thread with no photo cannot show 5.1 working.
    5.1: POST /price {} : plannedSend.approver human:ben, the bubbles carry /quote/<slug>, the
    stage is quoted; every entry of plannedSend.guards reads not_applied, because the guards do not
    run over a send Ben authored (behaviour.md answer 43) and the file says so rather than claiming
    a pass; GET /quote shows record.status sent and every line priced.
    5.3: POST /message "What does that include, and how much is the labour?": the reply's figure
    equals one line of GET /quote's record to the penny (£x.xx), plannedSend.factIds names a
    quote_line fact carrying that figure, the figure guard passes, no hold.
    2.7 still after the quote: POST /message "Can you do it any cheaper?": a hold for ben whose
    reason names money beyond a quote line, and no figure in the reply.
    6.2: POST /message "Leave it with me, I'll get back to you next month": one acknowledgement
    with no question; POST /run sends nothing.
    6.1 and 6.3: POST /accept: response.notice.title "Quote accepted", state.conversation.stage
    accepted, state.quote.notifications gains accepted, and the planned send is one acknowledgement
    whose only promise is that Ben has been told, with no date, time or duration. A second POST
    /accept answers 409.

    The database refusal, which is what stops the sandbox door mounted on the deployed server from
    writing a real quote row. The door host always points the desk at the branch, so drive this on
    the app instead: start a second copy on another free port with the variable removed,
    `env -u COMMS_V2_DATABASE_URL PORT=<port2> npm run dev`, log in as Ben there, and from that tab
    POST /api/comms-v2/sandbox/start with a job and a postcode. Expect the ready turn to refuse,
    naming COMMS_V2_DATABASE_URL, with no quote drafted and no new row on /admin/quotes. Stop that
    second copy afterwards.

    Evidence is screenshots of the sandbox thread and the sandbox data pages only; never
    screenshot another admin list or page, and never attach the server log. If the log matters,
    cite its line numbers in the PR text. Stop the dev server when done.

    Report only scenarios you drove live against the running app in this run copy: the direnv
    environment check, the boot on the per-run port, Ben's login, the sandbox thread, the comms-v2
    door and its refusals. A scenario is "pass" only when it was driven live. Anything you did not
    drive live (a vitest run, a YAML parse, a static check, reading the code) is never a scenario
    marked pass: leave it out, or record it as not live-validated with the reason. The pipeline
    refuses a pass that was not driven live and fails the whole step.
