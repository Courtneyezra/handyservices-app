# no-mistakes pipeline configuration for handyservices-app.
# Keys are documented at https://kunchenguid.github.io/no-mistakes/reference/repo-config/ and by
# `no-mistakes doctor`. commands.*, test.instructions and document.instructions are read only from the
# default-branch copy of this file.

commands:
  prepare: "npm ci"

# Documentation ownership for the document step.
document:
  instructions: |
    AGENTS.md is the map for every session; docs/RUNBOOK.md owns operations. A comms change is
    documented under docs/comms-v2 (README.md, contracts.md, design.md, checklist.md) and in
    server/comms-v2/README.md; the old desk's design stays in docs/COMMS_AGENTS_V3_DESIGN.md.
    Never duplicate a fact: point at its owner.

# Product startup and live validation. The test step runs the product end to end as Ben would,
# against the running app, and records the evidence in the PR; the human merges on evidence.
test:
  instructions: |
    Environment: a run copy lives under a run root that carries a direnv .envrc, so its shell
    inherits the non-production environment: the Neon branch database, NODE_ENV=development,
    COMMS_WORKER=0, Stripe and Twilio on their test credentials where placed and on well-formed
    inert values until then, and well-formed inert values for the providers without test
    credentials (Meta, storage, paging). If a variable such as DATABASE_URL is missing from your
    shell, run every command through `direnv exec . <command>`. Never print a variable's value;
    refer to variables by name. DATABASE_URL must never contain the production host marker
    (ep-broad-king); stop if it does.

    Pick a free TCP port for this run (for example with `node -e` opening a server on port 0 and
    printing the port it was given), export it as PORT, and start the app with
    `PORT=<port> npm run dev`. Derive every URL from that value: the app serves
    http://127.0.0.1:$PORT. Never use a fixed port; the app kills whatever already listens on the
    port it is given, so a fixed one would stop a parallel run or a developer's server.
    Open http://127.0.0.1:$PORT/admin/login and log in as Ben with the email in
    PIPELINE_ADMIN_EMAIL and the password in PIPELINE_ADMIN_PASSWORD from the environment
    (valid on the Neon branch only). Then open http://127.0.0.1:$PORT/admin/sandbox and drive the
    change under test as Ben would: the sandbox types as a customer on the reserved number and
    nothing it does can reach a real customer.

    For a comms change, run the relevant lines of docs/comms-v2/checklist.md as sandbox
    conversations. For the new desk under server/comms-v2 use its own door: `npm run
    comms-v2:door` serves it on a loopback port (the URL is printed once; POST /start, /message,
    /run, /age, /reset). Model calls are live; a refused or rate-limited model is a finding, not a pass.

    The door has five doors, one per channel, on the same drama customer (server/comms-v2/README.md,
    "Driving the door"): POST /start with door whatsapp, sms, form, email or call; POST /message
    with channel whatsapp, sms or email; POST /call for Ben ringing them. The seed's `whatsapp:
    true | false` says whether the number is known to be on WhatsApp, which decides where a form or
    a call's reply goes (WhatsApp template, else SMS, else email). Drive these checklist lines as
    scenarios, one per line, and judge each on the planned send: 1.2 form door, seed whatsapp true
    and again false, the acknowledgement carries the enquiry (the web form template with the
    enquiry quoted, or the freeform SMS that quotes it); 1.3 call door outcome ben_rang with a
    transcript, seed whatsapp true, the post-call template with the name and the job from the call,
    or, when the branch's template cache has no approved post-call template, a hold for Ben whose
    reason names the purpose and whose draft carries the words (record which, that hold is the
    contract's rule, never an SMS fallback); 1.4 sms door, seed whatsapp false, the reply is on
    SMS, one message, and invites them to WhatsApp; 1.5 call door outcome answered_inbound with a
    transcript, then a WhatsApp message, no reply mentions a call; 3.1 sms or whatsapp door, ignore
    the call offer and keep messaging, scoping continues; 3.2 and 3.3 whatsapp door, then POST
    /call with a transcript in which Ben asks for photos, the follow-up names the job, the file
    carries ben_asked_for, media is on the ledger as asked, then a WhatsApp message with a photo is
    thanked once and scoping continues; 3.4 the same thread with "yes please call me" before the
    call, no hold on the file after it; 3.5 call door outcome missed gets one text back (seed
    whatsapp true: the missed-call template; false: its words on SMS) and outcome answered_inbound
    gets nothing.

    For a change to Ben's board (/admin/comms-v2, server/comms-v2/api), drive the board itself in
    the browser as Ben and run the scenario list the goal's section of server/comms-v2/README.md
    carries. First give the pipeline's admin account Ben's approver slot on the branch database, or
    every release and answer is refused 403 before the desk is reached. Run this against the branch
    database through the repo's own client (`direnv exec . npx tsx -e` importing server/db and
    drizzle-orm's `sql`); it is safe to re-run, the key conflicts and updates:
      insert into app_settings (id, key, value)
      select gen_random_uuid()::text, 'comms_v2_approvers',
             jsonb_build_object('ben', jsonb_build_array(u.id))
      from users u where lower(u.email) = lower($1)
      on conflict (key) do update set value = excluded.value;
    Bind $1 from process.env.PIPELINE_ADMIN_EMAIL inside the script rather than typing the address,
    so no value reaches a command line. It writes one row; if it writes none that account is not on
    the branch, and the board refuses every release and answer until it is.
    The pipeline's admin account has the VA role on the branch database, so its sidebar
    does not carry the board: open /admin/comms-v2 by URL. For Ben answering a customer from a
    card: a held sandbox card, Ben taps it, writes a reply and sends; the card's turn list shows his
    turn labelled with his own `human:` approver (his email or user id) against the desk's own
    `agent.comms_v2`, with the bubbles as the
    sender rendered them; the hold on the card is cleared; the next customer message is answered by the desk again; and a reply the
    sender will not carry, one over the bubble ceiling, is refused with its reason shown on the
    board and nothing sent.

    For the Scheduling specialist (server/comms-v2/scheduling, checklist 2.6 as replaced, 5.4 and 5.5)
    drive the door's scheduling fixture as server/comms-v2/README.md describes, opening each thread
    with a message that names the job and a postcode: (a) POST /scheduling/fixture {"completed": 6}
    then "When can you come?" during scoping, the reply carrying the lead time read from the diary
    as a diary-sourced fact, never a day; (b) POST
    /scheduling/fixture {"diary":"none"} then the same question, the reply carrying "Dates come with
    your quote" and no lead time; (c) POST /scheduling/fixture {"quote":true} then "What dates do you
    have?", the reply carrying the /quote/ picker link and no day or slot; (d) POST /scheduling/fixture
    {"booked":true} then "Can we move it to the week after?", the planned send holding for ben with
    a date_change reason and the reply confirming the booked date from the diary; then POST
    /scheduling/fixture/reset. The fixture writes marked synthetic rows on the branch only.

    Evidence is screenshots of the sandbox thread, the sandbox data pages and Ben's board
    (/admin/comms-v2) only; never screenshot another admin list or page, and never attach the
    server log. The board is permitted because it reads the board's own sandbox door store, so
    until a live store feeds it there is nothing on it but sandbox threads; whoever wires that live
    store must come back to this line before the board stays permitted. If the log matters,
    cite its line numbers in the PR text. Stop the dev server when done.

    Report only scenarios you drove live against the running app in this run copy: the direnv
    environment check, the boot on the per-run port, Ben's login, the sandbox thread, the comms-v2
    door and its refusals, and for a board change the board scenarios themselves. A scenario is
    "pass" only when it was driven live. Anything you did not drive live (a vitest run, a YAML parse, a static check, reading the code) is never a scenario
    marked pass: leave it out, or record it as not live-validated with the reason. The pipeline
    refuses a pass that was not driven live and fails the whole step.
